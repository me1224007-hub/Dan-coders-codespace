    <script>
      // Background image carousel rotation
      (function() {
        let currentImageIndex = 0;
        const images = ['carousel-img-1', 'carousel-img-2'];
        const interval = 5000; // 5 seconds per image
        
        function rotateCarousel() {
          // Remove active class from current image
          document.getElementById(images[currentImageIndex]).classList.remove('active');
          
          // Move to next image
          currentImageIndex = (currentImageIndex + 1) % images.length;
          
          // Add active class to new image
          document.getElementById(images[currentImageIndex]).classList.add('active');
        }
        
        // Start carousel rotation
        setInterval(rotateCarousel, interval);
      })();

      // Simple client-side login using HR mock data
      (function(){
        var script = document.createElement('script');
        script.src = 'hr-data.js';
        script.onload = function(){
          var form = document.getElementById('login-form');
          if(form){
            form.addEventListener('submit', function(e){
              e.preventDefault();
              var id = document.getElementById('employeeId').value.trim();
              if(!id) return alert('Enter Employee ID');
              if(window.HR && window.HR.login(id)){
                window.location.href = 'leaveapplication.html';
              } else {
                alert('Employee not found. Use EMP001 or EMP002 for prototype.');
              }
            });
          }
        };
        document.head.appendChild(script);
      })();
    </script>
