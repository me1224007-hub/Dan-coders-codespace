<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manav Sampada UP - Login (new)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#135bec",
            "background-light": "#f6f6f8",
            "background-dark": "#101622",
          },
          fontFamily: {
            "display": ["Public Sans", "sans-serif"]
          },
        },
      },
    }
  </script>
<style>
    .group:focus-within label, .group-has-value label {
        transform: translateY(-1.25rem) scale(0.8);
        color: #135bec;
    }
    input:not(:placeholder-shown) + label {
        transform: translateY(-1.25rem) scale(0.8);
        color: #135bec;
    }
    /* Carousel Styles */
    .bg-carousel {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
    }
    .carousel-image {
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
    }
    .carousel-image.active {
        opacity: 1;
    }
    .carousel-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(19, 91, 236, 0.4) 0%, rgba(0, 0, 0, 0.5) 100%);
        z-index: 0;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111318] dark:text-white">
<!-- Background Carousel -->
<div class="bg-carousel">
  <div class="carousel-image active" id="carousel-img-1" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 800%22><rect fill=%22%23f5f5f5%22 width=%221200%22 height=%22800%22/><text x=%22600%22 y=%22400%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23999%22>Government of Uttar Pradesh Emblem</text></svg>');"></div>
  <div class="carousel-image" id="carousel-img-2" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 800%22><rect fill=%22%23d4a574%22 width=%221200%22 height=%22800%22/><text x=%22600%22 y=%22400%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23fff%22>Uttar Pradesh Building</text></svg>');"></div>
  <div class="carousel-overlay"></div>
</div>

<div id="shared-header-container"></div>
<div class="relative flex min-h-screen w-full items-center justify-center overflow-hidden p-4">
  <div class="absolute inset-0 z-0 opacity-10 dark:opacity-20" style='background-image: url("admin-images.jpg"); background-position: center; background-size: cover;'></div>
  <div class="relative z-10 flex w-full max-w-md flex-col items-center">
    <div class="mb-8 flex flex-col items-center text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white drop-shadow-lg">Manav Sampada</h1>
      <p class="mt-1 text-base text-gray-100 drop-shadow">Uttar Pradesh Employee Portal</p>
    </div>

    <div class="w-full rounded-xl bg-white/80 dark:bg-[#182133]/80 shadow-lg backdrop-blur-sm p-8">
      <form class="space-y-6" id="login-form-new">
        <div class="relative group">
          <input class="form-input peer block w-full appearance-none rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-transparent px-4 pb-2.5 pt-4 text-base text-[#111318] dark:text-white focus:border-primary focus:outline-none focus:ring-0" id="employeeId" name="employeeId" placeholder=" " required type="text" />
          <label class="absolute left-4 top-3.5 z-10 origin-[0] -translate-y-1/2 scale-100 transform text-base text-[#616f89] dark:text-gray-400 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-5 peer-focus:scale-75 peer-focus:text-primary dark:peer-focus:text-primary" for="employeeId">Employee ID / User ID</label>
        </div>

        <div class="relative group">
          <input class="form-input peer block w-full appearance-none rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-transparent px-4 pb-2.5 pt-4 text-base text-[#111318] dark:text-white focus:border-primary focus:outline-none focus:ring-0" id="password" name="password" placeholder=" " required type="password" />
          <label class="absolute left-4 top-3.5 z-10 origin-[0] -translate-y-1/2 scale-100 transform text-base text-[#616f89] dark:text-gray-400 duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-5 peer-focus:scale-75 peer-focus:text-primary dark:peer-focus:text-primary" for="password">Password</label>
        </div>

        <div class="flex items-center justify-between">
          <a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
        </div>

        <button class="flex w-full cursor-pointer items-center justify-center rounded-lg bg-primary h-12 px-4 text-base font-bold text-white shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-background-dark" type="submit">
          <span class="truncate">Login</span>
        </button>
      </form>
    </div>

    <div class="mt-8 flex items-center justify-center space-x-2">
      <span class="material-symbols-outlined text-xl text-[#616f89] dark:text-gray-400">language</span>
      <select aria-label="Select language" class="form-select border-none bg-transparent py-1 pl-1 pr-8 text-sm font-medium text-[#616f89] dark:text-gray-300 focus:outline-none focus:ring-0">
        <option>English (US)</option>
        <option>हिन्दी</option>
      </select>
    </div>
  </div>
</div>

<div id="shared-footer-container"></div>

<script>
  // Carousel rotation
  (function() {
    let currentImageIndex = 0;
    const images = ['carousel-img-1', 'carousel-img-2'];
    
    function rotateCarousel() {
      document.getElementById(images[currentImageIndex]).classList.remove('active');
      currentImageIndex = (currentImageIndex + 1) % images.length;
      document.getElementById(images[currentImageIndex]).classList.add('active');
    }
    
    setInterval(rotateCarousel, 5000); // Rotate every 5 seconds
  })();

</script>
<script src="hr-data.js"></script>
<script>
  // Form submit using HR data layer
  (function(){
    var form = document.getElementById('login-form-new');
    if(form){
      form.addEventListener('submit', function(e){
        e.preventDefault();
        var id = document.getElementById('employeeId').value.trim();
        if(!id) return alert('Enter Employee ID');
        if(window.HR && window.HR.login(id)){
          window.location.href = 'leaveapplication.html';
        } else {
          alert('Employee not found. Use EMP001 or EMP002 for prototype.');
        }
      });
    }
  })();
</script>
</script>
<script src="shared-nav.js"></script>
</body></html>
